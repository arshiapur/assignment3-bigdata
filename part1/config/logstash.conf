input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics_pattern => "entity-counts-.*"
    group_id => "part1-elastic"
    auto_offset_reset => "earliest"
    metadata_max_age_ms => 10000
    codec => json
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "entities-latest"
    document_id => "%{run_id}|%{entity}|%{label}"
    version => "%{version}"
    version_type => "external_gte"
    manage_template => false
  }
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "entities-history"
    document_id => "%{run_id}|%{batch_id}|%{entity}|%{label}"
    manage_template => false
  }
}
